<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
        xmlns:f="http://java.sun.com/jsf/core"
        xmlns:p="http://primefaces.org/ui"
        xmlns:h="http://java.sun.com/jsf/html"
        xmlns:pm="http://primefaces.org/mobile"
        xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
        xmlns:ui="http://java.sun.com/jsf/facelets"
        contentType="text/html">    
    <f:view renderKitId="PRIMEFACES_MOBILE"/>
    <h:head>
        <script name="jquery/jquery.js" library="primefaces"></script>
        <title>Laboratorios ABD</title>
        <link rel="icon" type="images/ico" href="resources/images/icons/favicon.ico" />
        <link rel="icon" type="images/ico" href="../resources/images/icons/favicon.ico" />
        <link rel="stylesheet" href="../resources/font-awesome/css/font-awesome.min.css"/>     
    </h:head>
    
    <h:body >     
        <h:form id="pedidosForm">   
            <pm:page id="recibosPage">
                <pm:header   fixed="true" style="background-color: #3572E2; color: white; font-size: 14px; font-family: serif " />
                <p:messages id="msg"  showDetail="true" autoUpdate="true" closable="true" redisplay="true"/>
                <p:growl id="mensajes" showDetail="true" life="1500" />
                <ui:include src="cabecera.xhtml" />
                <pm:content>
                    <p:tabMenu activeIndex="2"  style="background: #085061; color: white;font-size: 12px  " >           
                        <p:menuitem value="Facturas" icon="ui-icon-search" resetValues="true"  outcome="/views/facturacion"    iconPos="bottom"/>
                        <p:menuitem value="Recibos" icon="ui-icon-edit" rendered="#{loginBean.rolFacturar=='S'}"  resetValues="true" outcome="/views/recibos" iconPos="bottom"/>
                        <p:menuitem value="Pedidos" icon="ui-icon-edit" resetValues="true" outcome="/views/pedidos" iconPos="bottom"/>
                   </p:tabMenu>     
                    <p:tabMenu activeIndex="0"  style="background: #085061; color: white;font-size: 10px  ">                     
                         <p:menuitem value="Pedido" icon="ui-icon-edit"  resetValues="true" outcome="/views/pedidos" iconPos="bottom"/>
                         <p:menuitem value="Mis Pedidos" icon="ui-icon-edit"  resetValues="true" outcome="/views/MisPedidos" iconPos="bottom"/>                                       
                    </p:tabMenu> 
                    
                    <p:panel id="myDataFiltro" header="NUEVO PEDIDO" style="font-weight: bolder; text-align:center; font-size: 14px;">  
                        <p:panel header="CLIENTE" rendered="#{pedidosBean.dataBusqueda==true}" >
                            <p:panelGrid columns="1" >
                                <p:column> 
                                    <p:outputLabel value="Dato a buscar" />
                                    <p:inputText id="datoBusqueda" value="#{pedidosBean.valorBusqueda}" maxlength="60"   />
                                </p:column>
                                <p:column>  
                                    <p:outputLabel value="Filtrar por:"  />
                                    <p:selectOneMenu  title="Filtrar por:" value="#{pedidosBean.tipoBusqueda}"  >
                                        <f:selectItem itemLabel="Nombre" itemValue="N"  />
                                        <f:selectItem itemLabel="Razon Social" itemValue="R"  />
                                        <f:selectItem itemLabel="Carnet" itemValue="C"  />
                                        <f:selectItem itemLabel="Codigo" itemValue="O" />
                                    </p:selectOneMenu>
                                </p:column>                              
                                <p:panelGrid columns="2">
                                    <p:column>
                                        <p:commandButton id="buscarClienteButton"   value="Buscar" update="mensajes myDataFiltro myDataClientes"  ajax="true" actionListener="#{pedidosBean.buscarCliente(event)}"   action="pedidos" icon="ui-icon-search"  />
                                    </p:column>
                                    <p:column>
                                        <p:commandButton value="Cancelar" type="reset"  icon="ui-icon-forbidden"  />
                                    </p:column>
                                </p:panelGrid>  
                            </p:panelGrid>
                       </p:panel>
                        

                        <p:panel header="SELECCIONE CLIENTE"    style="font-weight: bolder; text-align:center; font-size: 14px;"
                                 rendered="#{pedidosBean.dataClientes==true}" >

                            <p:dataTable id="singleDT" var="car" value="#{pedidosBean.listPersonas}" selectionMode="single" selection="#{pedidosBean.cliElegido}" rowKey="#{car.codigo}"     emptyMessage="..."  >
                                 <f:facet name="header">
                                     Elija la Razón Social
                                 </f:facet>

                                 <p:column headerText="Razón Social" style="font-size:  14px; width: 50%">
                                     <h:outputText value="#{car.nombre}"  style="font-size: 12px;" />
                                 </p:column>
                                 <p:column headerText="Nit" style="font-size:  12px; width: 25%"> 
                                     <h:outputText value="#{car.ruc}" style="font-size: 10px;"/>
                                 </p:column>
                                 <p:column headerText="Ciudad" style="font-size:  12px; width: 25%">
                                     <h:outputText value="#{car.ciudad}" style="font-size: 10px;"/>
                                 </p:column>
                                 <f:facet name="footer">
                                     <p:commandButton process="singleDT" update=":pedidosForm" icon="ui-icon-search" value="View" oncomplete="PF('carDialog').show()" />
                                 </f:facet>
                             </p:dataTable>                       

                            <p:panelGrid columns="1">
                                <p:column>
                                    <p:commandButton id="elegirClienteButton" value="Elegir Cliente" update="mensajes myDataFiltro myDataClientes mydataPago" type="submit" actionListener="#{pedidosBean.elegirCliente(event)}" rendered="#{pedidosBean.dataClientes==true}" action="pedidos"     icon="ui-icon-search"  style="background-color: #aec7f5; color: white;"  />
                                </p:column>        
                            </p:panelGrid>
                        </p:panel>      
                        
                        <p:panel id="myDataClientes" header="PEDIDO CLIENTE: #{pedidosBean.cliente.codigo}" closeTitle="DATOS DEL PEDIDO" toggleSpeed="10000" toggleable="true" collapsed="false"
                                
                                rendered="#{pedidosBean.dataOperaciones==true}">        
                            <p:panelGrid   columns="2"  style="  background-color: #eee">
                                <p:outputLabel value="Código"/>
                                <p:outputLabel value="#{pedidosBean.cliente.codigo}" style="font-weight: bold"/>
                                <p:outputLabel value="Nombre" />
                                <p:outputLabel value="#{pedidosBean.cliente.nombre}" style="font-weight: bold" />
                                <p:outputLabel value="Ciudad"/>
                                <p:outputLabel value="#{pedidosBean.cliente.ciudad}"  style="font-weight: bold"/>
                                <p:outputLabel value="Direccion"/>
                                <p:outputLabel value="#{pedidosBean.cliente.direccionDom}"  style="font-weight: bold"/>
                                <p:outputLabel value="Teléfono"/>
                                <p:outputLabel value="#{pedidosBean.cliente.telefonoDom}"  style="font-weight: bold"/>
                                <p:outputLabel value="Correo" />
                                <p:outputLabel value="#{pedidosBean.cliente.email}" style="font-weight: bold" />                         
                            </p:panelGrid>
                            <br></br>
                            <p:panelGrid columns="2" >   
                                <p:outputLabel value="Vendedor"   />
                                <p:selectOneMenu value="#{pedidosBean.codVendedor}" required="true" requiredMessage="Debe seleccionar un vendedor">
                                    <f:selectItem itemLabel="Elija Vendedor" itemValue="" />
                                    <f:selectItems value="#{pedidosBean.listVendedores}" var="tipo"
                                                   itemLabel="#{tipo.nombre}" itemValue="#{tipo.codigo}"/>
                                </p:selectOneMenu>    
                                <p:outputLabel value="Fecha Entrega" />                        
                                <p:inputText value="#{pedidosBean.fechaEntrega}" required="true" requiredMessage="Debe introducir la fecha de entrega dd/mm/yyyy" placeholder="dd/mm/yyyy" lang="es" />
                                <p:outputLabel value="Almacen" style="background-color:#FDFDFD; "  ></p:outputLabel>
                                <p:inputText id="almacen" value="#{pedidosBean.almacen}" readonly="true"  required="true" requiredMessage="Debe ingresar un almacen" lang="es" placeholder="Almacen" type="text" />                            

                            </p:panelGrid>
                            <br/>
                            <p:panel header="FILTRO DE PRODUCTOS" rendered="#{pedidosBean.dataFiltro==true}">
                                <p:panelGrid columns="2" >         
                                    
                                                                            
                                        <p:outputLabel value="Producto" />
                                        <p:inputText id="productoBusqueda" value="#{pedidosBean.productoBusqueda}" required="true" requiredMessage="Inbrese el Nombre/Codigo de producto a buscar" maxlength="60"   />
                                </p:panelGrid>     
                                <p:column>  
                                    <p:outputLabel value="Filtrar producto por:"  />
                                    <p:selectOneMenu  title="Filtrar por:" value="#{pedidosBean.tipoBusqueda}"  >
                                        <f:selectItem itemLabel="Nombre" itemValue="N"  />
                                        <f:selectItem itemLabel="Codigo" itemValue="O" />
                                    </p:selectOneMenu>
                                </p:column>  
                                <p:panelGrid columns="1">
                                    <p:column>
                                        <p:commandButton id="buscarProductoButton"   value="Buscar" update="mensajes myDataFiltro myDataClientes"  ajax="true" actionListener="#{pedidosBean.buscarProducto(event)}"   action="pedidos" icon="ui-icon-search" style="background-color: #aec7f5; color: white;"  />
                                    </p:column>
                                </p:panelGrid>  
                                                             
                            </p:panel>
             
                            <p:panel header="SELECCIONE PRODUCTO Y CANTIDAD"    style="text-align:center; font-size: 14px;"
                                     rendered="#{pedidosBean.dataPedido==true}" >

                                <p:dataTable id="singleDT2" var="producto" value="#{pedidosBean.listProductos}"  rendered="#{pedidosBean.dataPedido==true}" selectionMode="single" selection="#{pedidosBean.productoElegido}" rowKey="#{producto.producto}-#{producto.lote}"     emptyMessage="..."  >
                                    <f:facet name="header">
                                         Elija producto ...
                                    </f:facet>
                                    <!--<p:column headerText="Almacen" style="font-size:  10px; width: 5%">
                                        <h:outputText value="#{producto.almacen}"  style="font-size: 9px;" />
                                    </p:column>-->
                                    <p:column headerText="Cod" style="width: 5%">
                                        <h:outputText value="#{producto.producto}"  style="font-size: 11px;" />
                                    </p:column>
                                    <p:column headerText="Descripcion" style="width: 20%"> 
                                        <h:outputText value="#{producto.nombre}" style="font-size:10px;"/>
                                    </p:column>
                                    <p:column headerText="Und" style="width: 5%">
                                        <h:outputText value="#{producto.unidad}" style="font-size: 10px;"/>
                                    </p:column>     
                                    <!--
                                    <p:column headerText="Lote" style="font-size:  10px; width: 5%">
                                        <h:outputText value="#{producto.lote}" style="font-size: 9px;"/>
                                    </p:column>--> 
                                    <p:column headerText="Venc." style="width: 10%">
                                        <h:outputText value="#{producto.fecha}" style="font-size:10px;"/>
                                    </p:column>
                                    <p:column headerText="Saldo" style="width: 5%">
                                        <h:outputText value="#{producto.saldo}" style="font-size: 10px;"/>
                                    </p:column>
                                </p:dataTable>                       
                                <p:panelGrid columns="2"  columnClasses="label, value"   style="background:beige ; font-weight: bold;   border-width: thin; font-size: 14px"   >                              
                                    <p:outputLabel  value="Cantidad a Reservar:" />
                                    <p:inputText id="cantidadReserva" value="#{pedidosBean.cantidadReserva}" placeholder="0" type="number" required="true" requiredMessage="Introduzca la cantidad del producto a solcitar."  />                           
                                </p:panelGrid>         
                                <p:panelGrid columns="1">
                                    <p:column>
                                        <p:commandButton id="crearPedidoButton" value="Crear" update="mensajes myDataFiltro myDataClientes mydataPago" type="submit" actionListener="#{pedidosBean.crearPedido(event)}" rendered="#{pedidosBean.dataPedidoCrear==true}" action="pedidos"    style="background-color: #3572E2; color: white;" />
                                    </p:column>     
                                    <p:column>
                                        <p:commandButton id="adicionarProductoButton" value="Adicionar Producto" update="mensajes myDataFiltro myDataClientes mydataPago" type="submit" actionListener="#{pedidosBean.adicionarItemPedido(event)}" rendered="#{pedidosBean.dataPedidoAdicionar==true}" action="pedidos"  icon="ui-icon-edit"  style="background-color: #3572E2; color: white;"  />
                                    </p:column>       
                                </p:panelGrid>
                            </p:panel>
                            
                        </p:panel> 
                        <p:panel header="PEDIDO Nro:  #{pedidosBean.nroPedido}"  rendered="#{pedidosBean.dataPedidoTerminar==true}">
                            <p:dataTable  var="producto" value="#{pedidosBean.detallePedido}"   emptyMessage="..."  >
                                <p:column headerText="Nro." style="font-size:  10px; width: 2%">
                                    <h:outputText value="#{producto.item}"  style="font-size: 9px;" />
                                </p:column>
                                <p:column headerText="Codigo" style="font-size:  10px; width: 5%">
                                    <h:outputText value="#{producto.codigoItem}"  style="font-size: 9px;" />
                                </p:column>
                                <p:column headerText="Cant." style="font-size:10px;width: 5%"> 
                                    <h:outputText value="#{producto.cantidad}" style="font-size:10px;"/>
                                </p:column>
                                <p:column headerText="Und." style="font-size:10px;width: 5%">
                                    <h:outputText value="#{producto.unidad}" style="font-size: 10px;"/>
                                </p:column> 
                                <p:column headerText="PrecioBs" style="font-size:10px;width: 10%">
                                    <h:outputText value="#{producto.precioBs}" style="font-size:10px;"/>
                                </p:column>
                                <p:column headerText="Venc." style="font-size:10px;width: 10%">
                                    <h:outputText value="#{producto.fechaVencimiento}" style="font-size:10px;"/>
                                </p:column>
                                <!--<p:column headerText="Lote" style="font-size:10px;width: 10%">
                                    <h:outputText value="#{producto.lote}" style="font-size:10px;"/>
                                </p:column>--> 
                            </p:dataTable>  
                        </p:panel>
                    
                    
                        <p:panelGrid  id="mydataPago" columns="1">
                                                              
                            <p:column>
                                <p:commandButton id="terminarPedidooButton" value="Terminar" update="mensajes myDataFiltro myDataClientes mydataPago midataTerminar" type="submit" actionListener="#{pedidosBean.terminarPedido(event)}" rendered="#{pedidosBean.dataPedidoTerminar==true}" action="pedidos"     icon="ui-icon-search"  style="background-color: #085061; color: white;" />
                            </p:column>   
                            <p:column>
                                <p:commandButton id="nuevoPedidoButton" type="submit" value="Cancelar Pedido"  icon="ui-icon-edit" 
                                                 actionListener="#{pedidosBean.nuevoPedido(event)}"  action="pedidos"  update="mensajes myDataFiltro myDataClientes mydataPago"  
                                                 rendered="#{pedidosBean.dataPedidoCrear==true}" style="background-color: #ed4037; color: white;"  />              

                            </p:column>
                        </p:panelGrid>                            
                        <p:panel id="midataTerminar" header="DATOS PAGO PEDIDO No: #{pedidosBean.nroPedido}" rendered="#{pedidosBean.dataPedidoPagar==true}" >
                          
                            <p:dataTable  var="producto" value="#{pedidosBean.detallePedido}"   emptyMessage="..."  >
                                <p:column headerText="Nro." style="font-size:  10px; width: 5%">
                                    <h:outputText value="#{producto.item}"  style="font-size: 9px;" />
                                </p:column>
                                <p:column headerText="Codigo" style="font-size:  10px; width: 5%">
                                    <h:outputText value="#{producto.codigoItem}"  style="font-size: 9px;" />
                                </p:column>
                                <p:column headerText="Cantidad" style="font-size:10px;width: 5%"> 
                                    <h:outputText value="#{producto.cantidad}" style="font-size:10px;"/>
                                </p:column>
                                <p:column headerText="Unidad" style="font-size:10px;width: 5%">
                                    <h:outputText value="#{producto.unidad}" style="font-size: 10px;"/>
                                </p:column> 
                                <p:column headerText="PrecioBs" style="font-size:10px;width: 10%">
                                    <h:outputText value="#{producto.precioBs}" style="font-size:10px;"/>
                                </p:column>
                                <p:column headerText="Venc." style="font-size:10px;width: 10%">
                                    <h:outputText value="#{producto.fechaVencimiento}" style="font-size:10px;"/>
                                </p:column>
                                <p:column headerText="Lote" style="font-size:10px;width: 10%">
                                    <h:outputText value="#{producto.lote}" style="font-size:10px;"/>
                                </p:column> 
                            </p:dataTable>                        
                            
                        <p:panelGrid columns="2" style="background-color: #aec7f5; color: white;"> 
                            <p:outputLabel value="Neto Bs" />
                            <p:outputLabel value="#{pedidosBean.pedido.netoBs}" >
                                <f:convertNumber pattern="#,##0.00" />
                            </p:outputLabel> 
                        </p:panelGrid>
                            <br/><!-- comment -->
                            <p:panelGrid columns="1" style="background-color: #3d42ad; color: white;" rendered="#{pedidosBean.dataPedidoFinalizar==true}">
                            <p:outputLabel value="Pedido pagado ?" />
                             <p:selectOneMenu id="selectMenu" value="#{pedidosBean.pagado}" required="true">
                                <f:selectItem itemLabel="Seleccione Si/No" itemValue="" />
                                <f:selectItem itemLabel="SI" itemValue="Si" />
                                <f:selectItem itemLabel="NO" itemValue="No" />
                                <!-- Usamos Ajax para actualizar el formulario cuando cambie la selección -->
                                <p:ajax update="inputTextPanel" />
                            </p:selectOneMenu>        
                            <p:panel id="inputTextPanel"    >
                                <p:panelGrid columns="2"  rendered="#{pedidosBean.pagado eq 'Si'}" style="background-color: #3d42ad; color: white;" >
                                    <p:outputLabel  value="Nombre:"  />
                                    <p:inputText  value="#{pedidosBean.razonSocial}"  />
                                    <p:outputLabel  value="NIT:"  />
                                    <p:inputText  value="#{pedidosBean.nit}"  />     
                                    <p:outputLabel  value="Forma Pago"  />
                                    <p:selectOneMenu id="tipDocPago" value="#{pedidosBean.tipDocPago}"   >
                                        <f:selectItem itemLabel="Efectivo" itemValue="EFE"  />
                                        <f:selectItem itemLabel="QR" itemValue="QR"/>
                                        <f:selectItem itemLabel="Cheque" itemValue="CHQ"/>
                                        <f:selectItem itemLabel="Transferencia" itemValue="TRA"/>
                                        <p:ajax update="banco"  listener="#{pedidosBean.onDocPagoChanged}" />
                                    </p:selectOneMenu>  
                                   
                                        <p:outputLabel  value="Banco:"  /> 
                                        <p:selectOneMenu id="banco" value="#{pedidosBean.banco}" >
                                            <f:selectItem itemLabel="Seleccione banco" itemValue="" />
                                            <f:selectItems value="#{pedidosBean.bancos}" />
                                        </p:selectOneMenu>
                                   
                                </p:panelGrid>
                            </p:panel>    
                        </p:panelGrid>     
                        <p:column>
                            <p:commandButton id="pagarPedidooButton" value="Finalizar" update="mensajes myDataFiltro myDataClientes mydataPago midataTerminar" type="submit" actionListener="#{pedidosBean.pagarPedido(event)}" rendered="#{pedidosBean.dataPedidoFinalizar==true}" action="pedidos"     icon="ui-icon-search"  style="background-color: #085061; color: white;" />
                        </p:column>   
                    </p:panel>   
                        <p:column>
                            <p:commandButton id="nuevoPedidooButton" value="Nuevo pedido" update="mensajes myDataFiltro myDataClientes mydataPago midataTerminar" type="submit" actionListener="#{pedidosBean.nuevoPedido(event)}" rendered="#{pedidosBean.dataPedidoNuevo==true}" action="pedidos"     icon="ui-icon-search"  style="background-color: #73b846; color: white;" />
                        </p:column>  
                    </p:panel> 
                </pm:content>         
                <ui:include src="pie.xhtml" />
            </pm:page> 
        </h:form>             
    </h:body>     

    
    
</html>
