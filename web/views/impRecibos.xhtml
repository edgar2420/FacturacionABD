<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
        xmlns:f="http://java.sun.com/jsf/core"
        xmlns:p="http://primefaces.org/ui"
        xmlns:h="http://java.sun.com/jsf/html"
        xmlns:pm="http://primefaces.org/mobile"
        xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
        xmlns:ui="http://java.sun.com/jsf/facelets"
        contentType="text/html">    
    <f:view renderKitId="PRIMEFACES_MOBILE"/>
    <h:head>
        <script name="jquery/jquery.js" library="primefaces"></script>
        <title> Laboratorios ABD</title>
        <link rel="icon" type="images/ico" href="resources/images/icons/favicon.ico" />
        <link rel="icon" type="images/ico" href="../resources/images/icons/favicon.ico" />
        <link rel="stylesheet" href="../resources/font-awesome/css/font-awesome.min.css"/>   
    </h:head>
    
    <h:body>    
        <h:form id="facturacionForm">   
            <pm:page id="facturacionPage">
                <pm:header   fixed="true"    style="background-color: #3572E2; color: white; font-size: 14px; font-family:   serif " />
                <p:messages id="msg"  showDetail="true" autoUpdate="true" closable="true" redisplay="true"/>
                <p:growl id="mensajes" showDetail="true" life="40000" />
                <ui:include src="cabecera.xhtml" />
                <pm:content>
                    <p:tabMenu activeIndex="3"  style="background: #085061; color: white;font-size: 12px  " >                     
                        <p:menuitem value="Imp. Facturas" icon="ui-icon-search" resetValues="true"  outcome="/views/facturacion"    iconPos="bottom"/>
                        <p:menuitem value="Facturar" rendered="#{loginBean.rolFacturar=='S'}" icon="ui-icon-edit" resetValues="true" outcome="/views/cobranzas" iconPos="bottom"/>
                        <p:menuitem value="Cobranzas" rendered="#{loginBean.rolFacturar=='S'}" icon="ui-icon-edit" resetValues="true" outcome="/views/recibos" iconPos="bottom"/>
                        <p:menuitem value="Recibos" rendered="#{loginBean.rolFacturar=='S'}" icon="ui-icon-edit" resetValues="true" outcome="/views/impRecibos" iconPos="bottom"/>
                        <p:menuitem value="QR" icon="ui-icon-edit" rendered="#{loginBean.rolFacturar=='S'}" resetValues="true" outcome="/views/qr" iconPos="bottom"/>
                    </p:tabMenu>                       
                    <p:panel header="Datos Busqueda Recibo" id="myDataFiltro">
                        <p:panelGrid columns="1" >
                            <p:outputLabel value="Nro. Deposito" style="background-color:#FDFDFD; " ></p:outputLabel>
                            <p:inputText id="deposito" value="#{impRecibosBean.recibo}" type="number"  placeholder="Nro. Recibo" lang="es" />
                            <p:outputLabel value="Cliente" style="background-color:#FDFDFD;" ></p:outputLabel>
                            <p:inputText id="cliente" value="#{impRecibosBean.cliente}" placeholder="Cliente" lang="es" />
                            <p:outputLabel value="Fecha" style="background-color:#FDFDFD;" ></p:outputLabel>
                            <p:inputText id="fecha" value="#{impRecibosBean.fecha}" required="true" requiredMessage="Debe introducir una fecha dd/mm/yyyy" placeholder="dd/mm/yyyy" lang="es" />
                            <p:outputLabel value="Usuario" style="background-color:#FDFDFD;" ></p:outputLabel> 
                            <p:inputText id="login" value="#{loginBean.nomUsuario}"  disabled="true"  required="true" requiredMessage="Debe ingresar un almacen" lang="es" placeholder="Almacen" type="text" />
                            <p:outputLabel value="Tipo Impresión" style="background-color:#FDFDFD;" ></p:outputLabel> 
                            <p:inputSwitch id="tipoImpresion" label="Impresion" value="#{impRecibosBean.tipImpresion}"  onLabel="Carta" offLabel="Rollo"    />         
                            
                        </p:panelGrid>
                    
                        <center>
                            <h:panelGrid columns="2"  >
                                <p:column>
                                    <p:commandButton id="buscarRecibosBoton" ajax="true" value="Buscar" update="mensajes myDataFactura" type="submit" actionListener="#{impRecibosBean.buscarRecibos(event)}" action="impRecibos"  icon="ui-icon-search"  />
                                </p:column>
                                <p:column>
                                    <p:commandButton value="Cancelar" type="reset" icon="ui-icon-forbidden"  />
                                </p:column>
                            </h:panelGrid> 
                        </center>
                   </p:panel>                   
                 
                   <p:panel  id="myDataFactura" header="DETALLE RECIBOS" closeTitle="RECIBOS" toggleSpeed="10000" toggleable="true" collapsed="false" 
                             style="font-weight:  bolder; text-align:  center; font-size: 10px">  
                       <p:dataTable  resizableColumns="true"  var="data" value="#{impRecibosBean.listRecibos}"   tableStyleClass="ui-table-columntoggle" emptyMessage="..."  style="border: palegoldenrod">
                            <p:column headerText="PDF" style="width: 10%"  >
                                <h:outputLink value="/ABDFacturacion/faces/views/facturas/ABD-Recibo_#{data.nroDeposito}.pdf" >PDF</h:outputLink>
                            </p:column> 
                           <!--<p:column headerText="Nro. Deposito"    style="font-size:  10px; width: 10%" >
                                <p:outputLabel value="#{data.nroDeposito}"  style="font-size:10px;"/>
                            </p:column>    -->  
                            <p:column headerText="TIPO"    style="font-size:  10px; width: 10%">
                                <p:outputLabel value="#{data.tipPago}"  style="font-size: 10px;"/>
                            </p:column>                             
                             <p:column headerText="FECHA"    style="font-size:  10px; width: 20%">
                                 <p:outputLabel value="#{data.fecha}"  style="font-size: 10px;"/>
                            </p:column>                             
                            <p:column headerText="CLIENTE"    style="font-size:  10px; width: 20%">
                                <p:outputLabel value="#{data.codCliente}"  style="font-size: 10px;"/>
                            </p:column>                            
                            <p:column headerText="MONTO"    style="font-size:  10px; width: 10%">
                                <p:outputLabel value="#{data.monto}"  style="font-size: 10px;">
                                    <f:convertNumber pattern="0.00"/>
                                </p:outputLabel>
                            </p:column>          
                            <p:column headerText="RECUPERAR" style=" width: 20%" >
                                <p:commandButton value="#{data.nroDeposito}"  actionListener="#{impRecibosBean.reimprimirRecibo(event)}" icon="home" action="impRecibos" immediate="true"  style="font-size: 10px"> 
                                    <f:param name="idtrans" value="#{data.nroDeposito}" />
                                </p:commandButton>
                            </p:column>     
                        </p:dataTable>   
                    </p:panel>              
                </pm:content>         
                <ui:include src="pie.xhtml" />
            </pm:page> 
        </h:form>             
    </h:body>     
<style type="text/css">
.colored {
/*//background-color:  lightpink;*/
color: red;
}
.colorRed {
background-color: white;
color: red;
}
.coloredGreen {
/*// background-color: WHITE  ;*/
color:  green;
/*//font-size:    x-large;*/
}
.coloredBlue {
background-color: #085061;
color:   white;
/*//font-size:    x-large;*/
}
</style>      
    
</html>
